<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>鳌太线 · 秦岭山间 / 山径</title>

<main class="ao-shell"><header class="ao-heading"><div><small>鳌太线 · 冬季历史路线</small><h1>从鳌山，走向太白山。</h1><p>塘口 → 鳌山 → 太白山 → 下板寺 · 汤峪方向</p></div><div class="ao-head-actions"><button id="ao-character" type="button" disabled>角色</button><button id="ao-journal" type="button">旅行手帐</button><button id="ao-sound" type="button" aria-pressed="false">声音 · 关</button></div></header>
<div class="ao-meta"><span id="ao-environment">第1程 09:00 · 冬日晴风</span><span>冬季路线示意 · 游戏昼夜已压缩</span></div>
<section id="ao-map" class="ao-map" aria-label="塘口经鳌山和太白山至下板寺、汤峪方向的二维示意图，默认随行，右上角可切换全图"><canvas id="ao-canvas" aria-label="秦岭山径，点击或空格暂停与继续">请使用支持 Canvas 的浏览器。</canvas><div id="ao-markers" aria-label="实景打卡地点"></div>
<span class="ao-orientation" aria-hidden="true">西 · 鳌山　→　东 · 太白山</span><div class="ao-view" role="group" aria-label="地图视角"><button id="ao-follow" type="button" aria-pressed="true" disabled>跟随</button><button id="ao-overview" type="button" aria-pressed="false" disabled>全图</button></div><p id="ao-chapter" class="ao-chapter">塘口村 · 起点</p>
<div id="ao-night" class="ao-night" role="status" hidden><span aria-hidden="true">☾</span><h2 id="ao-night-title">把脚步交给夜晚</h2><p id="ao-night-copy">帐篷留着一点暖光，风从山坳经过。</p></div>
<div id="ao-loading" class="ao-loading" role="status"><p id="ao-loading-copy">秦岭山色正在展开…</p><button id="ao-retry" type="button" hidden>重新展开</button></div></section>
