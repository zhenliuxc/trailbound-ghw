<header class="art-page-header"><div><small>山径 · 鳌太线</small><h1 id="art-page-title">山间手绘</h1></div><button id="walk-toggle" type="button">返回山路 ×</button></header>

</section><section id="art-journal-wall"><section class="field-journal journal-notebook" aria-labelledby="journal-title">

  <ol id="journal-list" class="journal-list"></ol>
  <button id="journal-more" type="button" class="journal-more" hidden>继续翻阅 ↓</button>

</section>
</section><div id="ending-journal" hidden><div id="ending-badges"></div><p id="ending-detail"></p></div></main>

    <div><span id="journal-detail-position"></span><small id="journal-detail-hint">左右翻看沿途回忆</small></div>
    <button id="journal-detail-next" type="button" aria-controls="journal-detail-page">下一枚 <span aria-hidden="true">→</span></button>
  </footer>
