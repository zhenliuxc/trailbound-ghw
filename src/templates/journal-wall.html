<section class="field-journal journal-notebook" aria-labelledby="journal-title">
  <header class="journal-heading"><div><p class="eyebrow">FIELD NOTES / 把山野留在纸上</p><h2 id="journal-title">旅行手帐</h2></div><span id="journal-count">0个瞬间</span></header>
  <p class="journal-intro">点开一枚徽章，翻看沿途回忆。</p>
  <p id="discovery-status" role="status" aria-live="polite"></p>
  <div class="journal-toolbar">
    <div class="journal-toolbar-heading"><span id="journal-route-label">按路线翻看</span><span class="journal-route-scroll-hint" aria-hidden="true">左右滑动</span><span id="trip-count">本次记下0个瞬间</span></div>
    <div id="journal-route" class="journal-route-picker" role="radiogroup" aria-labelledby="journal-route-label"></div>
  </div>
  <p id="journal-filter-count" class="journal-note" role="status" aria-live="polite"></p>
  <ol id="journal-list" class="journal-list"></ol>
  <button id="journal-more" type="button" class="journal-more" hidden>继续翻阅 ↓</button>
  <p id="journal-storage" class="journal-note journal-storage">回忆自动保存在这个浏览器，相同的片刻只留一页。</p>
</section>
